[workspace]
members = [
    "crates/homesync-protocol",
    "crates/homesync-clock",
    "crates/homesync-dsp",
    "crates/homesync-media",
    "crates/homesync-audio",
    "crates/homesync-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lewisjohnvillamor/homesync"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
